<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Daftar Pembeli - Kebun Nusantara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen flex flex-col">

  <!-- Header Minimal -->
  <header class="bg-white border-b border-stone-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-emerald-700 text-white rounded-xl flex items-center justify-center text-base shadow-sm">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <div>
          <h1 id="auth-store-name" class="font-bold text-base text-emerald-950 leading-tight">Kebun Nusantara</h1>
          <p class="text-[11px] text-stone-500">Portal Akun Pembeli</p>
        </div>
      </a>
      <a href="index.html" class="text-xs font-semibold text-emerald-700 hover:text-emerald-900 bg-emerald-50 hover:bg-emerald-100 px-3 py-2 rounded-xl transition">
        <i class="fa-solid fa-arrow-left mr-1.5"></i>Kembali ke Katalog Toko
      </a>
    </div>
  </header>

  <!-- Konten Utama Login / Daftar -->
  <main class="flex-1 flex items-center justify-center p-4 py-10">
    <div class="bg-white rounded-2xl border border-stone-200 max-w-md w-full overflow-hidden shadow-xl">
      <div class="bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-6 text-center">
        <div class="w-12 h-12 bg-white/15 rounded-2xl flex items-center justify-center text-2xl text-amber-300 mx-auto mb-3">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <h2 id="page-title" class="text-xl font-bold">Masuk Akun Pembeli</h2>
        <p id="redirect-banner" class="text-xs text-emerald-100 mt-1">
          Login atau daftar akun terlebih dahulu sebelum melanjutkan proses checkout.
        </p>
      </div>

      <!-- Tab Switch Login / Daftar -->
      <div class="grid grid-cols-2 border-b border-stone-200 bg-stone-50 text-xs font-bold">
        <button id="tab-login" onclick="switchTab('login')" class="py-3.5 text-emerald-800 border-b-2 border-emerald-700 bg-white transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i>Login Username
        </button>
        <button id="tab-register" onclick="switchTab('register')" class="py-3.5 text-stone-500 hover:text-stone-800 transition">
          <i class="fa-solid fa-user-plus mr-1"></i>Daftar Akun Baru
        </button>
      </div>

      <div class="p-6">
        <!-- Form Login -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 text-sm">
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Username *</label>
            <input type="text" id="login-username" required placeholder="Masukkan username Anda (contoh: budi)" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Password *</label>
            <input type="password" id="login-password" required placeholder="Masukkan password (contoh: 123)" class="w-full px-3.5 py-2.5 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-3 rounded-xl"></div>
          <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-sm transition">
            Masuk & Lanjutkan
          </button>
          <p class="text-[11px] text-stone-500 text-center bg-stone-50 p-2 rounded-lg border border-stone-200/70">
            Akun demo bawaan: username <b>budi</b> / password <b>123</b> atau <b>siti</b> / <b>123</b>
          </p>
        </form>

        <!-- Form Daftar -->
        <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-3.5 text-sm">
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Username * (Untuk Login)</label>
            <input type="text" id="reg-username" required placeholder="Contoh: andi_kebun" class="w-full px-3.5 py-2 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Password *</label>
            <input type="password" id="reg-password" required placeholder="Buat password" class="w-full px-3.5 py-2 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Nama Lengkap / Instansi *</label>
            <input type="text" id="reg-fullname" required placeholder="Contoh: Andi Wijaya" class="w-full px-3.5 py-2 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Nomor WhatsApp Aktif *</label>
            <input type="tel" id="reg-phone" required placeholder="Contoh: 081234567890" class="w-full px-3.5 py-2 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Alamat Lengkap Pengiriman *</label>
            <textarea id="reg-address" rows="2" required placeholder="Jalan, Desa/Kelurahan, Kecamatan, Kota/Kabupaten" class="w-full px-3.5 py-2 border border-stone-300 rounded-xl focus:outline-none focus:border-emerald-600"></textarea>
          </div>
          <div id="reg-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-3 rounded-xl"></div>
          <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-sm transition">
            Daftar & Lanjutkan
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const initialMode = 'login';
    const nextAction = params.get('next') || '';

    function switchTab(mode) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      const titleEl = document.getElementById('page-title');

      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('reg-error').classList.add('hidden');

      if (mode === 'login') {
        titleEl.textContent = 'Masuk Akun Pembeli';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'py-3.5 text-emerald-800 border-b-2 border-emerald-700 bg-white transition';
        tabReg.className = 'py-3.5 text-stone-500 hover:text-stone-800 transition';
      } else {
        titleEl.textContent = 'Daftar Akun Pembeli Baru';
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = 'py-3.5 text-emerald-800 border-b-2 border-emerald-700 bg-white transition';
        tabLogin.className = 'py-3.5 text-stone-500 hover:text-stone-800 transition';
      }
    }

    function redirectAfterSuccess() {
      if (nextAction === 'checkout') {
        window.location.href = 'index.html?openCart=1';
      } else {
        window.location.href = 'index.html';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
      const passwordInput = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');

      const buyers = getBuyers();
      const found = buyers.find(b => b.username.toLowerCase() === usernameInput && b.password === passwordInput);

      if (!found) {
        errEl.textContent = 'Username atau password tidak cocok. Silakan periksa kembali atau pilih tab Daftar Akun Baru.';
        errEl.classList.remove('hidden');
        return;
      }

      setCurrentBuyer(found);
      redirectAfterSuccess();
    }

    function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim().toLowerCase().replace(/\s+/g, '_');
      const password = document.getElementById('reg-password').value;
      const fullName = document.getElementById('reg-fullname').value.trim();
      const phone = normalizePhone(document.getElementById('reg-phone').value.trim());
      const address = document.getElementById('reg-address').value.trim();
      const errEl = document.getElementById('reg-error');

      if (!username || username.length < 3) {
        errEl.textContent = 'Username minimal 3 karakter.';
        errEl.classList.remove('hidden');
        return;
      }

      const buyers = getBuyers();
      if (buyers.some(b => b.username.toLowerCase() === username)) {
        errEl.textContent = `Username "${username}" sudah terdaftar. Silakan gunakan username lain.`;
        errEl.classList.remove('hidden');
        return;
      }

      const newBuyer = { username, password, fullName, phone, address };
      buyers.push(newBuyer);
      saveBuyers(buyers);
      setCurrentBuyer(newBuyer);
      redirectAfterSuccess();
    }

    initStore();
    const s = getSettings();
    document.getElementById('auth-store-name').textContent = s.storeName;
    if (nextAction === 'checkout') {
      document.getElementById('redirect-banner').textContent = 'Silakan Login atau Daftar terlebih dahulu untuk melanjutkan checkout keranjang Anda.';
    }
    switchTab(initialMode);
  </script>
</body>
</html>
